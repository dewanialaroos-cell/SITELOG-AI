name: SITELOG AI build check

on:
  push:
    branches: ["main", "v0.2-commercial", "fix/engineer-invitations"]
  pull_request:
    branches: ["main", "v0.2-commercial"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
